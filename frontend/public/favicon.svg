<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="4" y1="2" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- Dark rounded-square tile background -->
  <rect width="32" height="32" rx="7" fill="#0d0e16"/>

  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="url(#g)" opacity="0.07"/>

  <g clip-path="url(#tile-clip)">
    <!-- Hub-to-satellite connector lines (scaled from 24→32 viewport: ×1.333) -->
    <g stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
      <!-- top satellite arm -->
      <line x1="16" y1="8.67" x2="16" y2="12.53"/>
      <!-- bottom-left satellite arm -->
      <line x1="13.47" y1="18.13" x2="9.73" y2="20.53"/>
      <!-- bottom-right satellite arm -->
      <line x1="18.53" y1="18.13" x2="22.27" y2="20.53"/>
    </g>

    <!-- Outer ring / silhouette lines at lower opacity -->
    <g stroke="url(#g)" stroke-width="1.2" stroke-linecap="round" opacity="0.28">
      <line x1="14.13" y1="8.13" x2="9.2"  y2="19.87"/>
      <line x1="17.87" y1="8.13" x2="22.8" y2="19.87"/>
      <line x1="10.27" y1="22.4" x2="21.73" y2="22.4"/>
    </g>

    <!-- Hub circle (centre) -->
    <circle cx="16" cy="15.47" r="3.47" fill="url(#g)"/>

    <!-- Top satellite -->
    <circle cx="16" cy="6.27" r="2.47" fill="url(#g)"/>

    <!-- Bottom-left satellite -->
    <circle cx="7.87" cy="22.4" r="2.47" fill="url(#g)"/>

    <!-- Bottom-right satellite -->
    <circle cx="24.13" cy="22.4" r="2.47" fill="url(#g)"/>
  </g>
</svg>